[project]
name = "sentinelpay-ai"
version = "0.1.0"
description = "SentinelPay AI/ML subsystem — intelligence layer (understand, reason, propose, verify). Never authorizes money."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "langgraph>=0.2.45",
    "langchain-core>=0.3",
    "jinja2>=3.1",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-api>=1.28",
]

[project.optional-dependencies]
# Hosted model providers — only needed in HOSTED/PRODUCTION modes.
groq = ["groq>=0.11"]
# Vector stores
chroma = ["chromadb>=0.5"]
pinecone = ["pinecone-client>=5.0"]
# Local semantic embeddings (offline RAG, no API key)
embeddings = ["sentence-transformers>=3.0"]
# Multimodal / document ingestion
docs = ["pypdf>=5.0", "pillow>=11.0"]
# Dev / test
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "gateway",
    "agents",
    "subagents",
    "models",
    "tools",
    "memory",
    "rag",
    "security",
    "policy_ai",
    "schemas",
    "shared",
    "config",
    "evaluation",
    "integration",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
