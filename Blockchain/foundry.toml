[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
libs = ["contracts/lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

[fmt]
line_length = 100
tab_width = 4

# RPC endpoints are read from environment; never hard-code secrets/keys here.
[rpc_endpoints]
anvil = "${ANVIL_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
# base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
